name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10.0" "torchvision>=0.25.0"
          python -m pip install -r requirements.txt pytest
          python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q scannet replica tools drone_scene
      - name: Check release hygiene
        run: python scripts/check_release.py
      - name: Run CPU tests
        run: python -m pytest -q
      - name: Check installed CLIs
        run: |
          drone-scene --help >/dev/null
          mlpsp-train --help >/dev/null
          mlpsp-train-replica --help >/dev/null
          mlpsp-eval-rgb --help >/dev/null
          mlpsp-eval-lseg --help >/dev/null
          mlpsp-benchmark --help >/dev/null
          mlpsp-convert-checkpoint --help >/dev/null
