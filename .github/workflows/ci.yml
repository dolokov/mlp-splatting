name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install "numpy>=1.24,<2" "Pillow>=10" pytest==8.3.5 ruff==0.11.2 scipy==1.15.2
      - run: python -m pip install --no-deps -e .
      - run: ruff check drone_scene tests/conftest.py tests/test_colmap_help.py tests/test_diagnostics.py tests/test_ffmpeg.py tests/test_frame_selection.py tests/test_geometry.py tests/test_mlp_compat.py tests/test_mlp_cuda.py tests/test_mlp_dataset.py tests/test_pipeline.py tests/test_web_viewer.py
      - run: python -m pytest -q tests/test_colmap_help.py tests/test_diagnostics.py tests/test_ffmpeg.py tests/test_frame_selection.py tests/test_geometry.py tests/test_mlp_compat.py tests/test_mlp_cuda.py tests/test_mlp_dataset.py tests/test_pipeline.py tests/test_web_viewer.py
# CPU orchestration/geometry/FFmpeg checks; not a GPU training certification.
