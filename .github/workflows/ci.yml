name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e . pytest==8.3.5 ruff==0.11.2 scipy==1.15.2
      - run: ruff check drone_scene tests
      - run: python -m pytest -q
# CPU orchestration/geometry/FFmpeg checks; not a GPU training certification.
